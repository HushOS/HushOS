# Run the published images instead of building from source:
#   docker compose -f compose.yaml -f compose.images.yaml up -d
# latest follows main. Pin a release with HUSHOS_IMAGE_TAG=1.4.2 (or 1.4, or 1), or one build
# with a sha-<commit> tag (docs/self-hosting.md, Running the published images).

services:
    migrate:
        image: ghcr.io/hushos/hushos-migrate:${HUSHOS_IMAGE_TAG:-latest}
        build: !reset null

    web:
        image: ghcr.io/hushos/hushos-web:${HUSHOS_IMAGE_TAG:-latest}
        build: !reset null

    worker:
        image: ghcr.io/hushos/hushos-worker:${HUSHOS_IMAGE_TAG:-latest}
        build: !reset null
