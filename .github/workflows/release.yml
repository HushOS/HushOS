name: Release

# release-please (release-please-config.json, .release-please-manifest.json) on every push to
# main: it keeps one release pull request open that bumps the version everywhere and updates
# CHANGELOG.md from the Conventional Commit subjects since the last release. Merging that pull
# request creates the tag vX.Y.Z and the GitHub release, and the images job below copies that
# commit's sha-<commit> images to X.Y.Z, X.Y and X. See CONTRIBUTING.md (Releasing).
on:
    push:
        branches: [main]
    # Each finished CI run for a push to main, re-runs included: the images job tags a release
    # whose images were not yet published when the release appeared.
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    # Copies the version tags again for a release that exists, if the images job failed.
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag whose images to tag, as vX.Y.Z
                required: true

permissions:
    contents: read

# CI runs finish in any order, and a shared group would cancel all but the newest waiting one:
# one group per commit for those.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}${{ github.event_name == 'workflow_run' && format('-{0}', github.event.workflow_run.head_sha) || '' }}
    cancel-in-progress: false

jobs:
    release-please:
        name: Release pull request and tag
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            # A pull request opened with the workflow's own GITHUB_TOKEN starts no workflows, so CI
            # would never run on the release pull request, and the repository does not let Actions
            # open pull requests anyway. release-please runs only as the release GitHub App
            # (preferred) or with a fine-grained token in RELEASE_PLEASE_TOKEN; with neither it
            # says so and stops, without failing the push.
            - name: Release credentials
              id: setup
              env:
                  APP_ID: ${{ vars.RELEASE_APP_ID }}
                  HAS_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
              run: |
                  if [[ -n "$APP_ID" || "$HAS_TOKEN" == true ]]; then
                      echo "configured=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice title=Release::release-please is not set up: add the release app or token, see CONTRIBUTING.md (Releasing)."
                      echo "configured=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: Token from the release app
              id: app
              if: steps.setup.outputs.configured == 'true' && vars.RELEASE_APP_ID != ''
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
            - uses: googleapis/release-please-action@v5
              id: release
              if: steps.setup.outputs.configured == 'true'
              with:
                  token: ${{ steps.app.outputs.token || secrets.RELEASE_PLEASE_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    # The release's images are the ones main already built and published as sha-<commit>: this
    # copies them, by digest, to X.Y.Z, X.Y and X. Nothing is rebuilt, and running it again
    # writes the same tags. It runs when the release appears and again when CI for a release
    # commit finishes, so whichever comes second finds both the tag and the images, however
    # long CI took or however often it was re-run. Neither waits.
    images:
        name: Version tags (${{ matrix.image }})
        needs: release-please
        if: >-
            !cancelled() && (github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push') ||
            needs.release-please.outputs.release_created == 'true')
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: [web, worker, migrate]
        steps:
            - name: Release commit and version
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
                  RUN_SHA: ${{ github.event.workflow_run.head_sha }}
                  IMAGE_SUFFIX: ${{ matrix.image }}
              run: |
                  # After CI: the release tag on the commit it ran for, if there is one (an
                  # annotated tag's commit is the `^{}` line).
                  if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
                      auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
                      TAG=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
                          ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" 'refs/tags/v*' \
                          | awk -v sha="$RUN_SHA" '$1 == sha { ref = $2; sub(/^refs\/tags\//, "", ref); sub(/\^\{\}$/, "", ref); print ref }' \
                          | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -uV | tail -n 1)
                      if [[ -z "$TAG" ]]; then
                          echo "$RUN_SHA is not a release commit."
                          echo "skip=true" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                  fi
                  if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                      echo "::error::$TAG is not a release tag (vX.Y.Z)."
                      exit 1
                  fi
                  version=${TAG#v}
                  sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
                  # A release whose package.json names another version gets no version tags: the
                  # images would be labelled one version and tagged another.
                  declared=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$sha" --jq .content | base64 -d | jq -r .version)
                  if [[ "$declared" != "$version" ]]; then
                      echo "::warning title=Versions disagree::$TAG points at a commit whose package.json says $declared; no version tags were pushed."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  {
                      echo "skip=false"
                      echo "sha=$sha"
                      echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_SUFFIX}"
                      echo "tags=$version ${BASH_REMATCH[1]}.${BASH_REMATCH[2]} ${BASH_REMATCH[1]}"
                  } >> "$GITHUB_OUTPUT"
            - name: Set up Docker Buildx
              if: steps.release.outputs.skip == 'false'
              uses: docker/setup-buildx-action@v4
            - name: Log in to GHCR
              if: steps.release.outputs.skip == 'false'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Copy sha-<commit> to the version tags
              if: steps.release.outputs.skip == 'false'
              env:
                  IMAGE: ${{ steps.release.outputs.image }}
                  SHA: ${{ steps.release.outputs.sha }}
                  TAGS: ${{ steps.release.outputs.tags }}
              run: |
                  source="$IMAGE:sha-$SHA"
                  digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)
                  if [[ -z "$digest" ]]; then
                      # CI is still building the release commit's images: its end runs this again.
                      if [[ "$GITHUB_EVENT_NAME" == push ]]; then
                          echo "::notice title=Version tags after CI::$source is not published yet; this workflow copies the version tags when CI for $SHA finishes."
                          exit 0
                      fi
                      echo "::error title=No image for the release::$source does not exist. Re-run CI for $SHA on main (its image job publishes sha-$SHA); this workflow copies the version tags when that run finishes."
                      exit 1
                  fi
                  args=()
                  for tag in $TAGS; do args+=(--tag "$IMAGE:$tag"); done
                  docker buildx imagetools create "${args[@]}" "$IMAGE@$digest"
                  for tag in $TAGS; do
                      copied=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
                      [[ "$copied" == "$digest" ]] || { echo "::error::$IMAGE:$tag is $copied, not $digest"; exit 1; }
                      echo "$IMAGE:$tag -> $digest"
                  done
