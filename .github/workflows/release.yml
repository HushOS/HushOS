name: Release

# release-please (release-please-config.json, .release-please-manifest.json) on every push to
# main: it keeps one release pull request open that bumps the version everywhere and updates
# CHANGELOG.md from the Conventional Commit subjects since the last release. Merging that pull
# request creates the tag vX.Y.Z and the GitHub release, the images job below copies that
# commit's sha-<commit> images to X.Y.Z, X.Y and X, and the notes job then lists them, by
# digest, in the release's notes. See CONTRIBUTING.md (Releasing).
on:
    push:
        branches: [main]
    # Each finished CI run for a push to main, re-runs included: the images job tags a release
    # whose images were not yet published when the release appeared.
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    # Copies the version tags again for a release that exists, if the images job failed, and
    # rewrites its Server images section.
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag whose images to tag, as vX.Y.Z
                required: true

permissions:
    contents: read

# CI runs finish in any order, and a shared group would cancel all but the newest waiting one:
# one group per commit for those.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}${{ github.event_name == 'workflow_run' && format('-{0}', github.event.workflow_run.head_sha) || '' }}
    cancel-in-progress: false

jobs:
    release-please:
        name: Release pull request and tag
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            # A pull request opened with the workflow's own GITHUB_TOKEN starts no workflows, so CI
            # would never run on the release pull request, and the repository does not let Actions
            # open pull requests anyway. release-please runs only as the release GitHub App
            # (preferred) or with a fine-grained token in RELEASE_PLEASE_TOKEN; with neither it
            # says so and stops, without failing the push.
            - name: Release credentials
              id: setup
              env:
                  APP_ID: ${{ vars.RELEASE_APP_ID }}
                  HAS_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
              run: |
                  if [[ -n "$APP_ID" || "$HAS_TOKEN" == true ]]; then
                      echo "configured=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice title=Release::release-please is not set up: add the release app or token, see CONTRIBUTING.md (Releasing)."
                      echo "configured=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: Token from the release app
              id: app
              if: steps.setup.outputs.configured == 'true' && vars.RELEASE_APP_ID != ''
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
            - uses: googleapis/release-please-action@v5
              id: release
              if: steps.setup.outputs.configured == 'true'
              with:
                  token: ${{ steps.app.outputs.token || secrets.RELEASE_PLEASE_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    # The release's images are the ones main already built and published as sha-<commit>: this
    # copies them, by digest, to X.Y.Z, and to X.Y and X while it is the highest release in
    # them, so tagging an old release again never moves 0.9 or 0 back. Nothing is rebuilt. It
    # runs when the release appears and again when CI for a release commit finishes, and copies
    # only once that CI run's `latest` job has passed (the Linux suites, not WebKit, as for
    # `latest`): whichever comes second finds the tag, the images and the result, however long
    # CI took or however often it was re-run. Neither waits. A re-run rebuilds sha-<commit>
    # with a new digest, so an X.Y.Z that already names another digest is left alone, unless
    # this workflow is run by hand.
    images:
        name: Version tags (${{ matrix.image }})
        needs: release-please
        if: >-
            !cancelled() && (github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push') ||
            needs.release-please.outputs.release_created == 'true')
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Every leg resolves the same release, so whichever leg's outputs win, they agree.
        outputs:
            skip: ${{ steps.release.outputs.skip }}
            tag: ${{ steps.release.outputs.tag }}
        permissions:
            actions: read
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: [web, worker, migrate]
        steps:
            - name: Release commit, version and tags
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
                  RUN_SHA: ${{ github.event.workflow_run.head_sha }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
                  IMAGE_SUFFIX: ${{ matrix.image }}
              run: |
                  # Every release tag and its commit (an annotated tag's commit is its `^{}` line).
                  auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
                  git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
                      ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" 'refs/tags/v*' \
                      | awk '{ ref = $2; sub(/^refs\/tags\//, "", ref); sub(/\^\{\}$/, "", ref); if (ref ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/) print $1, ref }' \
                      > "$RUNNER_TEMP/tags"
                  # After CI: the release tag on the commit it ran for, if there is one.
                  if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
                      TAG=$(awk -v sha="$RUN_SHA" '$1 == sha { print $2 }' "$RUNNER_TEMP/tags" | sort -uV | tail -n 1)
                      if [[ -z "$TAG" ]]; then
                          echo "$RUN_SHA is not a release commit."
                          echo "skip=true" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                  fi
                  if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                      echo "::error::$TAG is not a release tag (vX.Y.Z)."
                      exit 1
                  fi
                  major=${BASH_REMATCH[1]}
                  minor=${BASH_REMATCH[2]}
                  version=${TAG#v}
                  sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
                  # A release whose package.json names another version gets no version tags: the
                  # images would be labelled one version and tagged another.
                  declared=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$sha" --jq .content | base64 -d | jq -r .version)
                  if [[ "$declared" != "$version" ]]; then
                      echo "::warning title=Versions disagree::$TAG points at a commit whose package.json says $declared; no version tags were pushed."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  # Only images the Linux suites passed: CI's `latest` job for this commit, from
                  # the run that just finished, or the commit's newest push run. By hand, the
                  # operator decides.
                  if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
                      if [[ "$GITHUB_EVENT_NAME" != workflow_run ]]; then
                          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=1" --jq '.workflow_runs[0].id // empty')
                      fi
                      result=''
                      if [[ -n "$RUN_ID" ]]; then
                          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
                              --jq '[.jobs[] | select(.name == "Move latest to this commit")][0].conclusion // empty')
                      fi
                      if [[ "$result" != success ]]; then
                          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
                              echo "::notice title=Version tags after CI::CI for $sha has not passed yet; this workflow copies the version tags when it does."
                              echo "skip=true" >> "$GITHUB_OUTPUT"
                              exit 0
                          fi
                          echo "::error title=No version tags::The Linux suites did not pass for $TAG ($sha, CI run $RUN_ID). Re-run that CI run; this workflow copies the version tags when it passes."
                          exit 1
                      fi
                  fi
                  # X.Y and X only while this is the highest release in them.
                  names=$({ cut -d ' ' -f 2 "$RUNNER_TEMP/tags"; echo "$TAG"; } | sort -uV)
                  tags=$version
                  if [[ "$(grep -E "^v$major\.$minor\." <<< "$names" | tail -n 1)" == "$TAG" ]]; then
                      tags+=" $major.$minor"
                  fi
                  if [[ "$(grep -E "^v$major\." <<< "$names" | tail -n 1)" == "$TAG" ]]; then
                      tags+=" $major"
                  fi
                  {
                      echo "skip=false"
                      echo "tag=$TAG"
                      echo "sha=$sha"
                      echo "version=$version"
                      echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_SUFFIX}"
                      echo "tags=$tags"
                  } >> "$GITHUB_OUTPUT"
            - name: Set up Docker Buildx
              if: steps.release.outputs.skip == 'false'
              uses: docker/setup-buildx-action@v4
            - name: Log in to GHCR
              if: steps.release.outputs.skip == 'false'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Copy sha-<commit> to the version tags
              if: steps.release.outputs.skip == 'false'
              env:
                  IMAGE: ${{ steps.release.outputs.image }}
                  SHA: ${{ steps.release.outputs.sha }}
                  VERSION: ${{ steps.release.outputs.version }}
                  TAGS: ${{ steps.release.outputs.tags }}
              run: |
                  source="$IMAGE:sha-$SHA"
                  digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)
                  if [[ -z "$digest" ]]; then
                      echo "::error title=No image for the release::$source does not exist. Re-run CI for $SHA on main (its image job publishes sha-$SHA); this workflow copies the version tags when that run passes."
                      exit 1
                  fi
                  # A registry error must not read as "no such tag yet".
                  if existing=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' 2> "$RUNNER_TEMP/inspect"); then
                      existing=$(jq -r '.digest // empty' <<< "$existing")
                  elif grep -q ': not found' "$RUNNER_TEMP/inspect"; then
                      existing=''
                  else
                      cat "$RUNNER_TEMP/inspect" >&2
                      exit 1
                  fi
                  if [[ -n "$existing" && "$existing" != "$digest" ]]; then
                      if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
                          echo "::notice title=Version tags left alone::$IMAGE:$VERSION is $existing, not $digest (sha-$SHA was rebuilt). Run this workflow by hand with v$VERSION to replace it."
                          exit 0
                      fi
                      echo "::warning title=Version tags replaced::$IMAGE:$VERSION was $existing; run by hand, so it now follows sha-$SHA ($digest)."
                  fi
                  args=()
                  for tag in $TAGS; do args+=(--tag "$IMAGE:$tag"); done
                  docker buildx imagetools create "${args[@]}" "$IMAGE@$digest"
                  for tag in $TAGS; do
                      copied=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
                      [[ "$copied" == "$digest" ]] || { echo "::error::$IMAGE:$tag is $copied, not $digest"; exit 1; }
                      echo "$IMAGE:$tag -> $digest"
                  done

    # Once all three images have their version tags, the release's notes get a "Server images"
    # section below release-please's changelog: each image at X.Y.Z as a docker pull line pinned
    # by the digest X.Y.Z names, and the upgrade steps. It is replaced, never repeated, on every
    # run that copies the tags (a CI re-run, a run by hand). Skipped with the tags: a release
    # whose CI has not passed, or whose package.json disagrees, gets no section either.
    notes:
        name: Server images in the release notes
        needs: images
        if: ${{ !cancelled() && needs.images.result == 'success' && needs.images.outputs.skip == 'false' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: scripts
                  persist-credentials: false
            - name: Write the Server images section
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ needs.images.outputs.tag }}
              run: scripts/release-images-notes.sh "$TAG"
