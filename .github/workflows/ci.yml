name: CI

on:
    push:
        branches: [main]
    # `labeled` so that adding `full-ci` to a pull request runs the jobs it unlocks.
    pull_request:
        types: [opened, synchronize, reopened, labeled]

permissions:
    contents: read

env:
    TURBO_TELEMETRY_DISABLED: 1

# A pull request's runs share one group per pull request, so a new push cancels the run it
# supersedes. Every other run (each push to main) has a group of its own commit: a group holds one
# running and one pending run, and a newer run replaces the pending one, so a shared main group
# dropped every push that arrived while another ran. Not `github.ref`: a pull request event on a
# merged pull request (release-please labels its release pull request after the merge) has no
# merge ref, runs with `refs/heads/main`, and cancelled the release commit's own run. Deploys and
# `latest` keep their order through their own groups (`latest` and `deploy` below).
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # What a pull request touches, so the jobs it cannot affect stay skipped (and `CI ok` still
    # passes). Anything unlisted, or a diff that cannot be read, runs everything. A push to main
    # always runs everything: its diff is only against the previous push, so a docs-only commit
    # after a failed or cancelled one would otherwise deploy code no suite passed.
    # A pull request event can arrive after the merge: release-please labels its release pull
    # request once the release exists. That run would test main's commit again, so this job,
    # check and build skip on a closed pull request, everything after them skips with them, and
    # `CI ok` passes.
    changes:
        name: Changed paths
        if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
        runs-on: ubuntu-latest
        outputs:
            browser: ${{ steps.paths.outputs.browser }}
            rust: ${{ steps.paths.outputs.rust }}
            webkit: ${{ steps.paths.outputs.webkit }}
        steps:
            # A pull request checks out its merge commit: the first parent is the base.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 2
            - name: Classify the changed files
              id: paths
              env:
                  EVENT: ${{ github.event_name }}
              run: |
                  files=''
                  if [ "$EVENT" = pull_request ]; then
                      files=$(git diff --name-only HEAD^1 HEAD)
                  fi
                  if [ -z "$files" ]; then
                      echo "Not a pull request, or no diff to read: running everything."
                      echo "browser=true" >> "$GITHUB_OUTPUT"
                      echo "rust=true" >> "$GITHUB_OUTPUT"
                      echo "webkit=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  browser=false
                  rust=false
                  webkit=false
                  while IFS= read -r file; do
                      case "$file" in
                          # Served at /design.md, and the suite's own fixtures. In a case
                          # pattern `*` crosses `/`, so these come before the prose patterns.
                          DESIGN.md | e2e/*) browser=true ;;
                          # Prose only. The pages' MDX renders in the app, so it is not here.
                          docs/* | *.md) ;;
                          *) browser=true ;;
                      esac
                      # The core, its bindings, and the TypeScript twin its fixtures are checked against.
                      case "$file" in
                          crates/* | Cargo.toml | Cargo.lock | rust-toolchain* | packages/crypto/* | .github/workflows/ci.yml) rust=true ;;
                      esac
                      # What the browser keeps on the device: sign-in, unlock, device keys, the
                      # sealed stash, the tree mirror and upload journal, and the WebKit jobs themselves. Storage APIs differ most in WebKit (#108 passed on Chromium
                      # and broke device removal there), so these run WebKit without `full-ci`.
                      # And the file viewer, whose rendering and refetching differ there too (#117's
                      # test passed on Chromium and failed on WebKit).
                      case "$file" in
                          packages/auth/src/client* | packages/auth/src/store* | packages/auth/src/device-storage* | \
                              packages/auth/src/with-storage-events* | packages/auth/src/worker* | \
                              packages/crypto/src/device.ts | packages/crypto/src/device-identity.ts | \
                              packages/crypto/src/stash* | packages/drive/src/mirror* | packages/drive/src/journal* | \
                              apps/web/src/lib/auth-client* | apps/web/src/lib/auth.ts | apps/web/src/lib/auth.worker.ts | \
                              apps/web/src/lib/session* | apps/web/src/lib/sign-out* | apps/web/src/lib/stash* | \
                              apps/web/src/lib/save-copy* | apps/web/src/lib/rollback-marks* | \
                              apps/web/src/lib/groups/store* | e2e/devices.spec.ts | e2e/saved-unlock.spec.ts | \
                              e2e/sealed-copy.spec.ts | e2e/recover.spec.ts | \
                              apps/web/src/components/drive/preview* | apps/web/src/components/drive/viewer-parts* | \
                              apps/web/src/components/drive/rich-text* | apps/web/src/components/drive/json-view* | \
                              apps/web/src/components/drive/office-viewer* | apps/web/src/components/drive/pdf-viewer* | \
                              apps/web/src/lib/previews* | e2e/preview.spec.ts | .github/workflows/ci.yml) webkit=true ;;
                      esac
                  done <<< "$files"
                  echo "browser=$browser" >> "$GITHUB_OUTPUT"
                  echo "rust=$rust" >> "$GITHUB_OUTPUT"
                  echo "webkit=$webkit" >> "$GITHUB_OUTPUT"
                  echo "browser suites: $browser, Rust core tests: $rust, WebKit for on-device storage and the viewer: $webkit"

    check:
        name: Check, migrate, and test
        if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: hushos
                    POSTGRES_PASSWORD: ci
                    POSTGRES_DB: hushos
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U hushos -d hushos"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql://hushos:ci@127.0.0.1:5432/hushos
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            - name: Lint, format, and typecheck
              run: bun run check
            # Loads every browser spec without a server or a browser: an import Bun can't resolve
            # or a spec that throws at load fails here, not in each browser job with no test run.
            - name: Browser specs load
              run: bun --bun playwright test --list > /dev/null
            # Release versioning: a copy of the version that disagrees with package.json is a
            # warning, never a failure, so it cannot hold up a deploy. The store build scripts and
            # release.yml's image tagging refuse it.
            - name: Versions agree
              run: bun run check:versions || echo "::warning title=Versions disagree::Run bun run check:versions; release.yml will not tag images for a release whose versions disagree."
            - name: Apply migrations to a fresh database
              run: bun run --cwd packages/db db:migrate
            - name: Check the schema matches the checked-in migrations
              run: |
                  bun run --cwd packages/db db:generate
                  if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
                    echo "Schema drift: run bun run db:generate and commit the migration." >&2
                    git status --porcelain packages/db/drizzle >&2
                    exit 1
                  fi
            - name: Check the rendered emails match the templates
              run: |
                  bun run email:render
                  if [ -n "$(git status --porcelain packages/emails/src/rendered)" ]; then
                    echo "Rendered emails are stale: run bun run email:render and commit." >&2
                    exit 1
                  fi
            # Not cached through Turborepo across runs: a package's test hash leaves out the
            # workspace packages it imports, so a cached pass would survive a change to them.
            - name: Test
              run: bun run test

    # The production build every browser job tests, built once. Its own job rather than a step
    # of the one above, so the browser jobs wait for a minute of build, not four of unit tests.
    build:
        name: Build
        if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            - name: Build
              run: bun run build
            # The Start plugin regenerates the route tree during the build; a commit
            # whose checked-in tree is stale fails here with the missing lines.
            - name: The committed route tree matches the built one
              run: git diff --exit-code -- apps/web/src/routeTree.gen.ts
            # One tar, not thousands of files (pdf.js's maps and fonts), and `.output` is a
            # hidden directory, which upload-artifact leaves out by default.
            - name: Pack the server output
              run: tar -cf web-output.tar -C apps/web .output
            - uses: actions/upload-artifact@v7
              with:
                  name: web-output
                  path: web-output.tar
                  retention-days: 1

    # WebKit runs on macOS, and the server output carries native modules for the platform it
    # was built on (takumi's OG renderer among them): the Linux build cannot start there. Built
    # once on macOS, only when the WebKit suite runs, for its four shards.
    build-macos:
        name: Build (macOS, for WebKit)
        needs: changes
        if: needs.changes.outputs.browser == 'true' && (github.event_name == 'push' || needs.changes.outputs.webkit == 'true' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            - name: Build
              run: bun run build
            - name: Pack the server output
              run: tar -cf web-output.tar -C apps/web .output
            - uses: actions/upload-artifact@v7
              with:
                  name: web-output-macos
                  path: web-output.tar
                  retention-days: 1

    # The Rust core's own tests (units, doc examples, both fixture directions), and the fuzz
    # crate's lib tests (the oracles its verdicts hold both twins to, against the fixtures; run
    # from the root, so on stable like fuzz:diff, not the nightly its fuzz targets pin). Stable,
    # with both builds cached, so a warm run is a minute or two. Only when the core, its
    # bindings, or the TypeScript twin its fixtures come from changed.
    rust:
        name: Rust core tests
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      . -> target
                      crates/hushos-core/fuzz -> target
            - run: cargo test -p hushos-core --locked
            - run: cargo test --manifest-path crates/hushos-core/fuzz/Cargo.toml --lib --locked

    # Chromium on Linux, against the production build from the job above, run by `bun run
    # start` (web and jobs worker) as `bun run dev` was before: no first-visit compile, and the
    # production Content Security Policy, the one hushos.com serves. Cookies are Secure only for
    # an https APP_ORIGIN, so http://localhost works as it did; in CI the server sends one
    # request per connection (server/plugins/request-context.ts), as the dev server did.
    # Families off, as hushos.com runs until billing charges for family folders: this suite
    # covers the off path (families.spec.ts checks they stay hidden), with the phone-sized
    # project for mobile.spec.ts. Files are split by measured time (scripts/e2e-shard.sh).
    # A public repository's standard runners cost nothing, and the plan offers no larger ones.
    e2e:
        name: Browser tests (chromium ${{ matrix.shard }}/3)
        needs: [changes, build]
        if: needs.changes.outputs.browser == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            - uses: actions/download-artifact@v8
              with:
                  name: web-output
            - name: Unpack the server output
              run: tar -xf web-output.tar -C apps/web
            - name: Local infrastructure (Postgres, Mailpit, Garage) and environment, families off
              run: |
                  bun run setup
                  echo 'GROUPS_ENABLED=false' >> .env
                  bun run infra:up
            - name: Apply migrations
              run: bun run db:migrate
            - name: Playwright version
              id: playwright
              run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
            - name: Cache Chromium
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
            # The system libraries every time; the browser download only on a cache miss.
            - name: Install Chromium for Playwright
              run: bunx playwright install --with-deps chromium
            # Streamed, not grouped: Turborepo holds a task's output until it ends, and a
            # server never ends. Playwright reuses whatever answers on 5173.
            - name: Start the production server and the jobs worker
              run: |
                  mkdir -p scratchpad
                  setsid bash -c 'exec bun run start >> scratchpad/e2e-server.log 2>&1' &
                  for i in $(seq 1 30); do
                      if curl -sf -o /dev/null http://localhost:5173/api/ready; then echo "ready after $((i * 2)) s"; exit 0; fi
                      sleep 2
                  done
                  echo "the server never answered"
                  tail -n 60 scratchpad/e2e-server.log
                  exit 1
              env:
                  TRUSTED_PROXY_HEADER: x-forwarded-for
                  TURBO_LOG_ORDER: stream
            - name: Run the browser suite against the production build
              run: bun run e2e -- --project=chromium --project=mobile $(scripts/e2e-shard.sh chromium ${{ matrix.shard }} 3)
            # The whole log is in the artifact below; its end is enough to see a server
            # that fell over.
            - name: Show the end of the server log
              if: failure()
              run: tail -n 60 scratchpad/e2e-server.log || true
            # A test that failed and then passed on retry still left its trace: keep it, so a
            # flake shows what went wrong instead of disappearing with the green run.
            - name: Keep traces of failures and the server log
              if: failure() || hashFiles('test-results/**/trace.zip') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-traces-chromium-${{ matrix.shard }}-${{ github.run_attempt }}
                  path: |
                      test-results
                      scratchpad/e2e-server.log
                  retention-days: 7

    # Families on, the self-hosting default, in one job against the production build, as the
    # other browser jobs: each block of families.spec.ts is serial and makes its own people, so
    # the blocks run side by side on the two workers. The longest block (removal, about two
    # minutes) sets the time, so a second shard would gain nothing. The switch is written out
    # rather than left to the default, so a change of default cannot quietly turn this job into
    # a second run of the off path.
    e2e-families:
        name: Browser tests (families)
        needs: [changes, build]
        if: needs.changes.outputs.browser == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            - uses: actions/download-artifact@v8
              with:
                  name: web-output
            - name: Unpack the server output
              run: tar -xf web-output.tar -C apps/web
            - name: Local infrastructure (Postgres, Mailpit, Garage) and environment, families on
              run: |
                  bun run setup
                  echo 'GROUPS_ENABLED=true' >> .env
                  bun run infra:up
            - name: Apply migrations
              run: bun run db:migrate
            - name: Playwright version
              id: playwright
              run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
            - name: Cache Chromium
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
            - name: Install Chromium for Playwright
              run: bunx playwright install --with-deps chromium
            - name: Start the production server and the jobs worker
              run: |
                  mkdir -p scratchpad
                  setsid bash -c 'exec bun run start >> scratchpad/e2e-server.log 2>&1' &
                  for i in $(seq 1 30); do
                      if curl -sf -o /dev/null http://localhost:5173/api/ready; then echo "ready after $((i * 2)) s"; exit 0; fi
                      sleep 2
                  done
                  echo "the server never answered"
                  tail -n 60 scratchpad/e2e-server.log
                  exit 1
              env:
                  TRUSTED_PROXY_HEADER: x-forwarded-for
                  TURBO_LOG_ORDER: stream
            # GROUPS_ENABLED reaches the spec from .env too: with it on, a server that says
            # families are off fails the run instead of skipping it.
            - name: Run the families suite against the production build
              run: bun run e2e -- --project=chromium e2e/families.spec.ts
            - name: Show the end of the server log
              if: failure()
              run: tail -n 60 scratchpad/e2e-server.log || true
            - name: Keep traces of failures and the server log
              if: failure() || hashFiles('test-results/**/trace.zip') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-traces-families-${{ github.run_attempt }}
                  path: |
                      test-results
                      scratchpad/e2e-server.log
                  retention-days: 7

    # WebKit on macOS, the build Safari ships. Linux has only WebKitGTK, which crashed
    # pages mid sign-up and differs in drag and drop, so its results said little about
    # Safari. macOS runners have no Docker: the infrastructure runs natively. It does not
    # gate deploys; a failure on main opens or updates an issue (webkit-report below).
    # On pull requests only with the `full-ci` label or a change to on-device storage (see
    # `changes`): four macOS shards are the most expensive part of a run, and every push to
    # main still runs them.
    e2e-webkit:
        name: Browser tests (webkit ${{ matrix.shard }}/4, macOS)
        needs: [changes, build-macos]
        if: needs.changes.outputs.browser == 'true' && (github.event_name == 'push' || needs.changes.outputs.webkit == 'true' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        runs-on: macos-15
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            - uses: actions/download-artifact@v8
              with:
                  name: web-output-macos
            - name: Unpack the server output
              run: tar -xf web-output.tar -C apps/web
            # Families off, as in the chromium suite; the families flows run on chromium only.
            - name: Local infrastructure (Postgres, Mailpit, Garage) without Docker, and environment, families off
              run: |
                  brew install postgresql@18 mailpit garage
                  bun run setup
                  echo 'GROUPS_ENABLED=false' >> .env
                  scripts/infra-native.sh
              env:
                  HOMEBREW_NO_INSTALL_CLEANUP: 1
                  HOMEBREW_NO_ENV_HINTS: 1
            - name: Apply migrations
              run: bun run db:migrate
            - name: Playwright version
              id: playwright
              run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
            - name: Cache WebKit
              uses: actions/cache@v6
              with:
                  path: ~/Library/Caches/ms-playwright
                  key: playwright-${{ runner.os }}-webkit-${{ steps.playwright.outputs.version }}
            - name: Install WebKit for Playwright
              run: bunx playwright install webkit
            - name: Start the production server and the jobs worker
              run: |
                  mkdir -p scratchpad
                  nohup bun run start >> scratchpad/e2e-server.log 2>&1 &
                  for i in $(seq 1 30); do
                      if curl -sf -o /dev/null http://localhost:5173/api/ready; then echo "ready after $((i * 2)) s"; exit 0; fi
                      sleep 2
                  done
                  echo "the server never answered"
                  tail -n 60 scratchpad/e2e-server.log
                  exit 1
              env:
                  TRUSTED_PROXY_HEADER: x-forwarded-for
                  TURBO_LOG_ORDER: stream
            - name: Run the browser suite against the production build
              run: bun run e2e -- --project=webkit $(scripts/e2e-shard.sh webkit ${{ matrix.shard }} 4)
            - name: Show the end of the server and infrastructure logs
              if: failure()
              run: |
                  tail -n 60 scratchpad/e2e-server.log || true
                  for log in "$RUNNER_TEMP"/hushos-infra/*.log; do echo "== $log"; tail -n 20 "$log"; done
            # A test that failed and then passed on retry still left its trace: keep it, so a
            # flake shows what went wrong instead of disappearing with the green run.
            - name: Keep traces of failures and the logs
              if: failure() || hashFiles('test-results/**/trace.zip') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-traces-webkit-${{ matrix.shard }}-${{ github.run_attempt }}
                  path: |
                      test-results
                      scratchpad/e2e-server.log
                      ${{ runner.temp }}/hushos-infra/*.log
                  retention-days: 7

    # WebKit does not hold up a deploy, so a failure on main must not go unseen: one open
    # issue collects them, retitled to the latest commit, with a comment per failed run. Main
    # runs overlap, so reports go one at a time; two at once would each open an issue.
    webkit-report:
        name: Report a WebKit failure on main
        needs: [build-macos, e2e-webkit]
        if: always() && (needs.build-macos.result == 'failure' || needs.e2e-webkit.result == 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-webkit-report
            queue: max
        permissions:
            issues: write
        steps:
            - name: Open or update the issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  title="WebKit failed on main ${GITHUB_SHA::7}"
                  body="The WebKit suite failed on $GITHUB_SHA: $RUN_URL (traces are in the run's artifacts). Deploys do not wait for WebKit, so this commit may already be live."
                  number=$(gh issue list --state open --author app/github-actions --search 'in:title "WebKit failed on main"' --json number,title \
                      --jq '[.[] | select(.title | startswith("WebKit failed on main"))][0].number // empty')
                  if [ -n "$number" ]; then
                      gh issue edit "$number" --title "$title"
                      gh issue comment "$number" --body "$body"
                  else
                      gh issue create --title "$title" --body "$body"
                  fi

    # Built on pull requests only with the `full-ci` label (a Dockerfile change wants it);
    # every push to main builds and publishes them as sha-<commit>. Not `latest`: runs for
    # different commits overlap, and an older one finishing last would move it backwards. The
    # `latest` job moves it, in commit order.
    images:
        name: Image ${{ matrix.image }}
        needs: check
        if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: web
                      dockerfile: apps/web/Dockerfile
                      target: runtime
                    - image: migrate
                      dockerfile: packages/db/Dockerfile
                      target: migrate
                    - image: worker
                      dockerfile: packages/jobs/Dockerfile
                      target: worker
        steps:
            - uses: actions/checkout@v7
            - name: Set image name
              id: image
              env:
                  IMAGE_SUFFIX: ${{ matrix.image }}
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
            # Release versioning (CONTRIBUTING.md, Releasing): the product version for the image
            # label. Version tags are copied from sha-<commit> by release.yml, never pushed here.
            - name: Product version
              id: release
              run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Log in to GHCR
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Pull requests build the images without publishing, so a broken Dockerfile cannot merge.
            # Layers come from the Actions cache (saved by main only), so an unchanged lockfile
            # skips each image's `bun install`.
            - name: Build (and publish on main)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  target: ${{ matrix.target }}
                  build-args: RELEASE_SHA=${{ github.sha }}
                  platforms: linux/amd64
                  push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
                  cache-from: type=gha,scope=image-${{ matrix.image }}
                  cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=image-{0}', matrix.image) || '' }}
                  tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.release.outputs.version }}
                      org.opencontainers.image.licenses=AGPL-3.0-only

    # `latest` is what hushos.com's Coolify and the published compose file pull, so it never
    # gets a build the Linux suites refused. WebKit is left out on purpose (see webkit-report).
    # A job skipped by its own condition (Rust or browser suites a change cannot affect) does
    # not hold it back; one skipped because a job it needs failed cannot happen here, since
    # changes and build must both have passed. It only moves forward. Runs for different commits overlap, so this takes them one at a time
    # (`queue: max` keeps every waiting run; the default keeps only the newest and cancels the
    # rest), and a commit older than the one `latest` names leaves it alone and succeeds:
    # re-running an old commit's CI rebuilds its images (release.yml copies them) without
    # moving `latest` back. The web image moves last, so its revision label, the one read
    # here, names a commit all three images have reached.
    latest:
        name: Move latest to this commit
        needs: [changes, check, build, rust, e2e, e2e-families, images]
        if: >-
            !cancelled() &&
            github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            needs.changes.result == 'success' && needs.check.result == 'success' &&
            needs.build.result == 'success' && needs.images.result == 'success' &&
            (needs.rust.result == 'success' || needs.rust.result == 'skipped') &&
            (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
            (needs.e2e-families.result == 'success' || needs.e2e-families.result == 'skipped')
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: ${{ github.workflow }}-latest
            queue: max
        permissions:
            contents: read
            packages: write
        outputs:
            current: ${{ steps.move.outputs.current }}
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Move latest, unless it already names a later commit
              id: move
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
                  # A registry error must not read as "no latest yet", or an old run would move it.
                  # A latest without a revision label is not one to reason about: stop.
                  if config=$(docker buildx imagetools inspect "$prefix-web:latest" --format '{{json .Image}}' 2> "$RUNNER_TEMP/inspect"); then
                      current=$(jq -r 'if has("config") then . else .["linux/amd64"] end | .config.Labels["org.opencontainers.image.revision"] // empty' <<< "$config")
                      if [[ -z "$current" ]]; then
                          echo "::error title=latest not moved::$prefix-web:latest has no org.opencontainers.image.revision label."
                          exit 1
                      fi
                  elif grep -q ': not found' "$RUNNER_TEMP/inspect"; then
                      current=''
                  else
                      cat "$RUNNER_TEMP/inspect" >&2
                      exit 1
                  fi
                  if [[ -n "$current" && "$current" != "$GITHUB_SHA" ]]; then
                      # Where this commit stands against latest's: ahead means it is later.
                      status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$current...$GITHUB_SHA" --jq .status)
                      case "$status" in
                          ahead) ;;
                          behind)
                              echo "::notice title=latest left alone::latest is at $current, a later commit than $GITHUB_SHA."
                              echo "current=false" >> "$GITHUB_OUTPUT"
                              exit 0
                              ;;
                          *)
                              echo "::error title=latest not moved::latest is at $current, which is $status against $GITHUB_SHA; main is never rewritten, so look before moving it by hand."
                              exit 1
                              ;;
                      esac
                  fi
                  # All three or none: every digest first, then the moves back to back, then a check.
                  declare -A digests
                  for image in migrate worker web; do
                      digests[$image]=$(docker buildx imagetools inspect "$prefix-$image:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r '.digest // empty')
                      [[ -n "${digests[$image]}" ]] || { echo "::error::$prefix-$image:sha-$GITHUB_SHA has no digest"; exit 1; }
                  done
                  for image in migrate worker web; do
                      docker buildx imagetools create --tag "$prefix-$image:latest" "$prefix-$image@${digests[$image]}"
                  done
                  for image in migrate worker web; do
                      moved=$(docker buildx imagetools inspect "$prefix-$image:latest" --format '{{json .Manifest}}' | jq -r .digest)
                      [[ "$moved" == "${digests[$image]}" ]] || { echo "::error::$prefix-$image:latest is $moved, not ${digests[$image]}"; exit 1; }
                      echo "$prefix-$image:latest -> $moved"
                  done
                  echo "current=true" >> "$GITHUB_OUTPUT"

    # Production pulls `latest`, so a deploy only redeploys what the job above moved. One at a
    # time, in order, and only while `latest` still names this commit: once a later commit's
    # run has moved it, that run deploys, and this one is skipped, not failed. So is one older
    # than the release production already runs. Not "only main's head": a head that then fails
    # its suites would leave `latest` ahead of production with no deploy coming, for the next
    # restart to ship unannounced. Both checks hold on a re-run of an old commit, which would
    # otherwise roll production back.
    deploy:
        name: Deploy production
        needs: latest
        if: needs.latest.outputs.current == 'true' && vars.DEPLOY_ENABLED == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
            group: ${{ github.workflow }}-deploy
            queue: max
        permissions:
            contents: read
            packages: read
        environment:
            name: production
            url: ${{ vars.DEPLOY_ORIGIN }}
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Skip a commit latest or production has moved past
              id: gate
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEPLOY_ORIGIN: ${{ vars.DEPLOY_ORIGIN }}
              run: |
                  config=$(docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}-web:latest" --format '{{json .Image}}')
                  current=$(jq -r 'if has("config") then . else .["linux/amd64"] end | .config.Labels["org.opencontainers.image.revision"] // empty' <<< "$config")
                  if [[ -z "$current" ]]; then
                      echo "::error title=Deploy stopped::latest has no org.opencontainers.image.revision label."
                      exit 1
                  fi
                  if [[ "$current" != "$GITHUB_SHA" ]]; then
                      echo "::notice title=Deploy skipped::latest has moved on to $current; its run deploys."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  # Unreachable, not ready or without the header: deploy, since that is the repair.
                  live=''
                  if curl --fail --silent --max-time 10 --dump-header "$RUNNER_TEMP/ready" --output /dev/null "$DEPLOY_ORIGIN/api/ready"; then
                      live=$(tr -d '\r' < "$RUNNER_TEMP/ready" | awk 'tolower($1) == "x-hushos-release:" { print $2 }')
                  fi
                  if [[ -n "$live" && "$live" != "$GITHUB_SHA" ]] && \
                      [[ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$live" --jq .status)" == ahead ]]; then
                      echo "::notice title=Deploy skipped::production runs $live, a later commit than $GITHUB_SHA."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  echo "skip=false" >> "$GITHUB_OUTPUT"
            - name: Request deployment
              if: steps.gate.outputs.skip == 'false'
              env:
                  DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
                  DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
              run: |
                  curl --request POST --fail --silent --show-error --max-time 30 --output /dev/null \
                    --header "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
                    "$DEPLOY_WEBHOOK_URL"
            # A later commit's `latest` can land between the gate and the pull, and production
            # then comes up on it: that release counts too.
            - name: Wait for the published release
              if: steps.gate.outputs.skip == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEPLOY_ORIGIN: ${{ vars.DEPLOY_ORIGIN }}
              run: |
                  compared=''
                  for _ in $(seq 1 90); do
                    live=''
                    if curl --fail --silent --show-error --max-time 10 --dump-header "$RUNNER_TEMP/ready" --output /dev/null "$DEPLOY_ORIGIN/api/ready"; then
                      live=$(tr -d '\r' < "$RUNNER_TEMP/ready" | awk 'tolower($1) == "x-hushos-release:" { print $2 }')
                    fi
                    if [[ "$live" == "$GITHUB_SHA" ]]; then
                      echo "Published release is ready."
                      exit 0
                    fi
                    if [[ -n "$live" && "$live" != "$compared" ]]; then
                      compared=$live
                      if [[ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$live" --jq .status || true)" == ahead ]]; then
                        echo "Production came up on $live, a later commit."
                        exit 0
                      fi
                    fi
                    sleep 5
                  done
                  echo "Timed out waiting for the published release." >&2
                  exit 1

    # The one check branch protection needs: it fails when any job above failed or was
    # cancelled, and passes when the rest passed or were skipped by their own conditions
    # (docs-only changes, Rust untouched, WebKit and images not asked for). A job skipped
    # because one it needs failed always comes with that failure here.
    ci-ok:
        name: CI ok
        if: always()
        needs: [changes, check, build, build-macos, rust, e2e, e2e-families, e2e-webkit, images]
        runs-on: ubuntu-latest
        steps:
            - name: Every job that ran passed
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  echo "results: $RESULTS"
                  case " $RESULTS " in
                      *" failure "* | *" cancelled "*) exit 1 ;;
                  esac
