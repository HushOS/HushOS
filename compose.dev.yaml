services:
    db:
        ports:
            - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    mailhog:
        image: mailhog/mailhog:v1.0.1
        platform: linux/amd64
        restart: unless-stopped
        ports:
            - '127.0.0.1:1025:1025'
            - '127.0.0.1:8025:8025'
    web:
        environment:
            SMTP_HOST: mailhog
