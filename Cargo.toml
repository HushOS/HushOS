[workspace]
resolver = "2"
members = ["crates/*"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The workspace profile is tuned for the mobile core; the relay is a server, so it optimises for speed.
[profile.release.package.hushos-push]
opt-level = 3

# Every dependency optimised in debug builds, the workspace's own crates not: the core's tests
# run its real Argon2, ML-DSA, ML-KEM and X25519 thousands of times, and unoptimised those took
# most of CI's Rust job (roster_call_fixtures alone two minutes; 40 s to 6 s here). The archive
# fixtures inflate gigabytes of zeros through zlib-rs and the CRC (docs/file-tools-design.md
# section 7), which this covers too. Debug assertions and overflow checks are unchanged.
[profile.dev.package."*"]
opt-level = 3
