[package]
name = "hushos-core-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "Coverage-guided fuzz targets for hushos-core (cargo-fuzz) and the verdicts the TypeScript twin is compared against."

[package.metadata]
cargo-fuzz = true

# Its own workspace: cargo-fuzz builds it with nightly and sanitizers, apart from the crates.
[workspace]
members = ["."]

[lib]
path = "src/lib.rs"

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
hushos-core = { path = "..", default-features = false, features = ["fuzzing", "fixtures"] }
libfuzzer-sys = "0.4"
serde_json = "1.0"
# For tests/common/groups.rs, which the verdicts include by path.
ml-kem = { version = "0.3", features = ["zeroize"] }
sha2 = "0.10.9"
x25519-dalek = { version = "3", features = ["static_secrets"] }

[profile.release]
debug = 1

[[bin]]
name = "canonical"
path = "fuzz_targets/canonical.rs"
test = false
doc = false
bench = false

