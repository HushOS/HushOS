[package]
name = "hushos-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "The client side of the HushOS protocol: OPAQUE, the account and workspace keys, Drive envelopes and content chunks."

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["uniffi"]
# Swift and Kotlin bindings. Off for a plain Rust or WebAssembly build.
uniffi = ["dep:uniffi"]
# The statement grammar's parser and encoder, public for the fuzz targets in fuzz/ only.
fuzzing = []
# Test-only doors (injected join draws, any device store, the bare typed-words rule) for the shared
# fixtures, the integration tests and the fuzz targets; never in an app build. The dev-dependency
# on this crate below turns it on for tests and examples.
fixtures = []

[dependencies]
opaque-ke = { version = "4.0.0", features = ["argon2"] }
argon2 = "0.5"
rand = "0.8.5"
base64 = "0.22.1"
serde = { version = "1.0.169", features = ["derive"] }
serde_json = "1.0"
generic-array = "=0.14.7"
sha2 = "0.10.9"
chacha20poly1305 = "0.10"
# HChaCha20 alone, for the key that opens one re-keyed record's origin (docs/integrity-design.md, "Re-keyed records"); the release chacha20poly1305 already uses.
chacha20 = "0.9"
aes-gcm = "0.10"
hkdf = "0.12"
blake2 = "0.10"
digest = "0.10"
thiserror = "2"
uniffi = { version = "0.32", optional = true, default-features = false }
x25519-dalek = { version = "3", features = ["static_secrets"] }
ml-kem = { version = "0.3", features = ["zeroize"] }
# Exactly this release: the FIPS 204 ACVP vectors in fixtures/ml-dsa-65-acvp.json must pass again before any other.
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "zeroize"] }
crypto_secretbox = "0.1"
salsa20 = "0.10"
ed25519-dalek = "3"
zeroize = "1"
unicode-normalization = "0.1"

[dev-dependencies]
rand = "0.8"
hushos-core = { path = ".", default-features = false, features = ["fixtures"] }
