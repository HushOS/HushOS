[package]
name = "hushos-push"
version = "0.1.0"
edition = "2021"
publish = false
description = "The push relay at push.hushos.com: content-free APNs and FCM pushes for HushOS servers (docs/devices-design.md 5)."

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
serde = { version = "1.0.169", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "migrate",
    "macros",
] }
subtle = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
