[package]
name = "hushos-push"
version = "0.1.0"
edition = "2021"
publish = false
description = "The push relay at push.hushos.com: content-free APNs and FCM pushes for HushOS servers (docs/devices-design.md 5)."

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
jsonwebtoken = "9"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
serde = { version = "1.0.169", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
