# XcodeGen spec: `xcodegen generate` (or `bun run ios:project`) writes HushOS.xcodeproj, which is not committed.
name: HushOS
options:
    bundleIdPrefix: com.hushos
    deploymentTarget:
        iOS: '26.0'
    xcodeVersion: '27.0'
    createIntermediateGroups: true
    generateEmptyDirectories: true
    groupSortPosition: top
settings:
    base:
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: '26.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
    HushOSCore:
        path: Packages/HushOSCore
    HushOSKit:
        path: Packages/HushOSKit
targets:
    HushOS:
        type: application
        platform: iOS
        sources:
            - path: App
            # Apple's required-reason declarations (docs/release/privacy-answers.md): one manifest for every bundle.
            - path: Privacy/PrivacyInfo.xcprivacy
              buildPhase: resources
            # Alpine colours, radii and spacing, generated by `bun run tokens` in packages/tokens; never edited here.
            - path: ../../packages/tokens/generated/Alpine.swift
              group: App/Theme
        dependencies:
            - package: HushOSKit
            - target: HushOSFiles
              embed: true
            - target: HushOSFilesUI
              embed: true
            - target: HushOSWidgets
              embed: true
            - target: HushOSShare
              embed: true
        # Simulator builds swap in an entitlements file with the File Provider testing mode (see FilesDomain); a device build must not carry it.
        configFiles:
            Debug: App/HushOS.xcconfig
            Release: App/HushOS.xcconfig
        # Entitlements come from the xcconfig, not from here: a target-level setting would shadow the per-SDK choice.
        info:
            path: App/Info.plist
            properties:
                CFBundleDisplayName: HushOS
                CFBundleName: HushOS
                CFBundleShortVersionString: '0.1.0'
                CFBundleVersion: '1'
                UILaunchScreen:
                    UIColorName: LaunchBackground
                    UIImageName: SplashMark
                UISupportedInterfaceOrientations:
                    [
                        UIInterfaceOrientationPortrait,
                        UIInterfaceOrientationLandscapeLeft,
                        UIInterfaceOrientationLandscapeRight,
                    ]
                UISupportedInterfaceOrientations~ipad:
                    [
                        UIInterfaceOrientationPortrait,
                        UIInterfaceOrientationPortraitUpsideDown,
                        UIInterfaceOrientationLandscapeLeft,
                        UIInterfaceOrientationLandscapeRight,
                    ]
                CFBundleURLTypes:
                    - CFBundleURLName: com.hushos.app
                      CFBundleURLSchemes: [hushos]
                NSAppTransportSecurity:
                    NSAllowsLocalNetworking: true
                LSSupportsOpeningDocumentsInPlace: false
                UIFileSharingEnabled: false
                ITSAppUsesNonExemptEncryption: false
                NSFileProviderDomainUsageDescription: HushOS keeps your encrypted files available in the Files app.
                NSCameraUsageDescription: HushOS uses the camera when you choose Take photo, and to scan your recovery kit.
                # Save Image in the share sheet of Send a copy; iOS ends the app if this is missing.
                NSPhotoLibraryAddUsageDescription: HushOS saves the photo you chose to your library.
                NSSupportsLiveActivities: true
                # Home Screen quick actions, as Android's launcher shortcuts (QuickActions.swift); the + menu's symbols.
                UIApplicationShortcutItems:
                    - UIApplicationShortcutItemType: com.hushos.app.upload-files
                      UIApplicationShortcutItemTitle: Upload files
                      UIApplicationShortcutItemIconSymbolName: doc.badge.plus
                    - UIApplicationShortcutItemType: com.hushos.app.upload-photos
                      UIApplicationShortcutItemTitle: Upload photos
                      UIApplicationShortcutItemIconSymbolName: photo.badge.plus
                    - UIApplicationShortcutItemType: com.hushos.app.new-folder
                      UIApplicationShortcutItemTitle: New folder
                      UIApplicationShortcutItemIconSymbolName: folder.badge.plus
                    - UIApplicationShortcutItemType: com.hushos.app.search
                      UIApplicationShortcutItemTitle: Search
                      UIApplicationShortcutItemIconSymbolName: magnifyingglass
                # Background transfers: iOS runs this task with a network to start uploads and keeps queued offline.
                BGTaskSchedulerPermittedIdentifiers: [com.hushos.app.transfers.start]
                UIBackgroundModes: [processing, fetch]
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.hushos.app
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                # Hush blue for system controls (alerts, menus, pickers) as well as the views that set it.
                ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
                INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    HushOSFiles:
        type: app-extension
        platform: iOS
        sources:
            - path: Files
            # Apple's required-reason declarations (docs/release/privacy-answers.md): one manifest for every bundle.
            - path: Privacy/PrivacyInfo.xcprivacy
              buildPhase: resources
        dependencies:
            - package: HushOSKit
            - sdk: FileProvider.framework
        entitlements:
            path: Files/HushOSFiles.entitlements
            properties:
                com.apple.security.application-groups: [group.com.hushos.app]
                keychain-access-groups: [$(AppIdentifierPrefix)group.com.hushos.app]
        info:
            path: Files/Info.plist
            properties:
                CFBundleDisplayName: HushOS Files
                CFBundleShortVersionString: '0.1.0'
                CFBundleVersion: '1'
                NSExtension:
                    NSExtensionPointIdentifier: com.apple.fileprovider-nonui
                    NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
                    NSExtensionFileProviderSupportsEnumeration: true
                    NSExtensionFileProviderSupportsPinning: true
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.hushos.app.files
                # Callback-based Objective-C API: Swift 5 mode keeps the sending-closure checks as warnings.
                SWIFT_VERSION: '5'
                SWIFT_STRICT_CONCURRENCY: minimal
    HushOSFilesUI:
        type: app-extension
        platform: iOS
        sources:
            - path: FilesUI
            # Apple's required-reason declarations (docs/release/privacy-answers.md): one manifest for every bundle.
            - path: Privacy/PrivacyInfo.xcprivacy
              buildPhase: resources
            - path: ../../packages/tokens/generated/Alpine.swift
              group: App/Theme
        dependencies:
            - package: HushOSKit
            - sdk: FileProviderUI.framework
        entitlements:
            path: FilesUI/HushOSFilesUI.entitlements
            properties:
                com.apple.security.application-groups: [group.com.hushos.app]
                keychain-access-groups: [$(AppIdentifierPrefix)group.com.hushos.app]
        info:
            path: FilesUI/Info.plist
            properties:
                CFBundleDisplayName: HushOS
                CFBundleShortVersionString: '0.1.0'
                CFBundleVersion: '1'
                NSExtension:
                    NSExtensionPointIdentifier: com.apple.fileprovider-actionsui
                    NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderUIController
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.hushos.app.filesui
                SWIFT_VERSION: '5'
                SWIFT_STRICT_CONCURRENCY: minimal
    HushOSWidgets:
        type: app-extension
        platform: iOS
        sources:
            - path: Widgets
            # Apple's required-reason declarations (docs/release/privacy-answers.md): one manifest for every bundle.
            - path: Privacy/PrivacyInfo.xcprivacy
              buildPhase: resources
            - path: ../../packages/tokens/generated/Alpine.swift
              group: App/Theme
        dependencies:
            - package: HushOSKit
            - sdk: WidgetKit.framework
            - sdk: SwiftUI.framework
            - sdk: ActivityKit.framework
        info:
            path: Widgets/Info.plist
            properties:
                CFBundleDisplayName: HushOS
                CFBundleShortVersionString: '0.1.0'
                CFBundleVersion: '1'
                NSExtension:
                    NSExtensionPointIdentifier: com.apple.widgetkit-extension
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.hushos.app.widgets
    # Save to HushOS: the share sheet's extension. Seals what is shared into the app group's queue and
    # hands it to a background session; the app adopts what is still on its way (ShareHandoff).
    HushOSShare:
        type: app-extension
        platform: iOS
        sources:
            - path: Share
            # Apple's required-reason declarations (docs/release/privacy-answers.md): one manifest for every bundle.
            - path: Privacy/PrivacyInfo.xcprivacy
              buildPhase: resources
            - path: App/Theme.swift
              group: Share/Shared
            - path: App/Glyphs.swift
              group: Share/Shared
            - path: ../../packages/tokens/generated/Alpine.swift
              group: Share/Shared
        dependencies:
            - package: HushOSKit
        entitlements:
            path: Share/HushOSShare.entitlements
            properties:
                com.apple.security.application-groups: [group.com.hushos.app]
                keychain-access-groups: [$(AppIdentifierPrefix)group.com.hushos.app]
        info:
            path: Share/Info.plist
            properties:
                CFBundleDisplayName: Save to HushOS
                CFBundleShortVersionString: '0.1.0'
                CFBundleVersion: '1'
                NSExtension:
                    NSExtensionPointIdentifier: com.apple.share-services
                    NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
                    NSExtensionAttributes:
                        # Files, photos, videos, PDFs, audio (a WhatsApp voice note is an .opus file), documents,
                        # several at once; a web page (its PDF or web archive when Safari offers one, else its
                        # link), a link, or text, each saved as a file.
                        NSExtensionJavaScriptPreprocessingFile: GetPage
                        NSExtensionActivationRule:
                            NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
                            NSExtensionActivationSupportsFileWithMaxCount: 20
                            NSExtensionActivationSupportsImageWithMaxCount: 20
                            NSExtensionActivationSupportsMovieWithMaxCount: 20
                            NSExtensionActivationSupportsWebPageWithMaxCount: 1
                            NSExtensionActivationSupportsWebURLWithMaxCount: 1
                            NSExtensionActivationSupportsText: true
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.hushos.app.share
                # NSItemProvider's callbacks: Swift 5 mode keeps the sending-closure checks as warnings, as the Files extensions do.
                SWIFT_VERSION: '5'
                SWIFT_STRICT_CONCURRENCY: minimal
schemes:
    HushOS:
        build:
            targets:
                HushOS: all
        run:
            config: Debug
